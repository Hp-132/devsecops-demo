apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  labels:
    app: demo-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      # INTENTIONAL for the demo: no securityContext / runAsNonRoot here.
      # This is the manifest Kyverno should reject.
      containers:
        - name: demo-app
          image: nginx:latest   # placeholder image so the deployment itself is easy to apply
          ports:
            - containerPort: 80
